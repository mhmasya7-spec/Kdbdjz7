name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and prepare project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "Project found in repository root."

          else
            ZIP=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Project files and ZIP archive not found."
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
              exit 1
            fi

            mkdir -p /tmp/proj
            unzip -oq "$ZIP" -d /tmp/proj

            SETTINGS=$(find /tmp/proj -type f \
              -name settings.gradle.kts \
              -not -path '*/.gradle/*' | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle.kts not found in ZIP."
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")

            if [ ! -f "$ROOT/app/build.gradle.kts" ]; then
              echo "ERROR: app/build.gradle.kts not found."
              exit 1
            fi

            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
            echo "Project found at: $ROOT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          set -e

          SDKM=$(find "$ANDROID_HOME" /usr/local/lib/android \
            -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKM" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKM" --licenses >/dev/null || true

          "$SDKM" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlateHunter-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
